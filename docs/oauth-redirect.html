<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spoiler Shield – voltando ao app</title>
<style>body{background:#050507;color:#f2f2f5;font-family:system-ui;text-align:center;padding:48px}a{color:#ff1744}</style></head>
<body>
<h2>🛡️ Voltando ao Spoiler Shield…</h2>
<p id="m">Se nada acontecer, toque no botão abaixo.</p>
<p><a id="go" href="#">ABRIR O APP</a></p>
<script>
// Hospede este arquivo em HTTPS (ex.: GitHub Pages) e registre a URL dele como "redirect URI"
// no portal do TikTok e da Meta. Ele só repassa code/state para o app; não guarda nada.
var q = location.search || "";
var target = "spoilershield://oauth" + q;
document.getElementById("go").href = target;
location.replace(target);
</script>
</body></html>
