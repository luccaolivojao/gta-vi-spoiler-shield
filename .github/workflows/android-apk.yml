name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Aceitar licenças e instalar SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true
      - name: Resultado dos testes
        if: always()
        run: |
          python3 - <<'PY'
          import glob,re
          t=f=e=s=0
          for x in glob.glob('app/build/test-results/**/*.xml',recursive=True):
              h=open(x,encoding='utf-8').read(2000)
              m=re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"',h)
              if m: a,b,c,d=map(int,m.groups()); t+=a;s+=b;f+=c;e+=d
              for n in re.findall(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure',open(x,encoding='utf-8').read()): print('FALHOU:',n[1],n[0])
          print(f'TESTES: total={t} falhas={f} erros={e} ignorados={s}')
          PY
      - name: APK debug
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/tests/
      - name: Publicar APK numa Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest android/app/build/outputs/apk/debug/app-debug.apk --title "APK debug (último build)" --notes "Build ${{ github.sha }}. APK de debug, assinado com a chave de debug." --target ${{ github.sha }}
